{{- $existing := lookup "v1" "Secret" .Release.Namespace "beta9-credentials" -}}
{{- $postgres := "" -}}
{{- $postgresAdmin := "" -}}
{{- $replication := "" -}}
{{- $redis := "" -}}
{{- $accessKey := "" -}}
{{- $secretKey := "" -}}
{{- $encryptionKey := "" -}}
{{- $ingressPassword := "" -}}
{{- if $existing -}}
{{- $postgres = index $existing.data "postgres-password" | b64dec -}}
{{- $postgresAdmin = index $existing.data "postgres-admin-password" | b64dec -}}
{{- $replication = index $existing.data "replication-password" | b64dec -}}
{{- $redis = index $existing.data "redis-password" | b64dec -}}
{{- $accessKey = index $existing.data "storage-access-key" | b64dec -}}
{{- $secretKey = index $existing.data "storage-secret-key" | b64dec -}}
{{- $encryptionKey = index $existing.data "encryption-key" | b64dec -}}
{{- $ingressPassword = index $existing.data "ingress-password" | b64dec -}}
{{- else -}}
{{- $postgres = randAlphaNum 32 -}}
{{- $postgresAdmin = randAlphaNum 32 -}}
{{- $replication = randAlphaNum 32 -}}
{{- $redis = randAlphaNum 32 -}}
{{- $accessKey = randAlphaNum 20 -}}
{{- $secretKey = randAlphaNum 40 -}}
{{- $encryptionKey = printf "sk_%s" (randAlphaNum 43) -}}
{{- $ingressPassword = randAlphaNum 24 -}}
{{- end -}}
{{- $basic := printf "beta9:%s\n" (include "beta9.htpasswdSHA" $ingressPassword) -}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: beta9-credentials
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: beta9
    app.kubernetes.io/component: credentials
stringData:
  postgres-password: {{ $postgres | quote }}
  postgres-admin-password: {{ $postgresAdmin | quote }}
  replication-password: {{ $replication | quote }}
  redis-password: {{ $redis | quote }}
  storage-access-key: {{ $accessKey | quote }}
  storage-secret-key: {{ $secretKey | quote }}
  encryption-key: {{ $encryptionKey | quote }}
  ingress-username: beta9
  ingress-password: {{ $ingressPassword | quote }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: beta9-ingress-auth
  labels:
    app.kubernetes.io/name: beta9
    app.kubernetes.io/component: ingress-auth
stringData:
  auth: {{ $basic | quote }}
  users: {{ $basic | quote }}
