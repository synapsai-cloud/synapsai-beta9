# -- See the common values.yaml for all the options you can set.
# https://github.com/bjw-s/helm-charts/blob/common-2.5.0/charts/library/common/values.yaml
global:
  labels: {}
  annotations: {}
  nameOverride: beta9

# -- Beta9's configuration.
# Merged on top of pkg/common/config.default.yaml. This profile keeps the
# gateway, Postgres, Redis, per-node image cache, and GPU checkpoint path,
# and turns off the services a local inference cluster does not need.
# https://github.com/beam-cloud/beta9/blob/main/pkg/common/config.default.yaml
config:
  fileService:
    enabled: false
  tailscale:
    enabled: false
  managedEndpoints:
    enabled: false
  monitoring:
    telemetry:
      enabled: false
  # Checkpoint archives go to the in-cluster MinIO. The access key and secret
  # key are generated into the beta9-credentials secret and applied when the
  # gateway starts. The embedded LocalStack test/test credentials are overridden.
  storage:
    workspaceStorage:
      defaultEndpointUrl: http://beta9-minio:9000
      defaultPresignedEndpointUrl: http://beta9-minio:9000
      defaultRegion: us-east-1
  worker:
    imageRegistry: public.ecr.aws/n4e0e1y0
    # Empty so each node uses its /images host path. A shared claim cannot
    # mount on more than one node.
    imagePVCName: ""
    criu:
      mode: nvidia
    pools:
      # Embedded defaults keep free capacity warm: default is 2 CPU / 1Gi,
      # build is 8 CPU / 32Gi. Zero keeps those workers from sitting idle.
      default:
        poolSizing:
          minFreeCpu: "0"
          minFreeMemory: "0"
          minFreeGpu: 0
      build:
        poolSizing:
          minFreeCpu: "0"
          minFreeMemory: "0"
          minFreeGpu: 0
      nvidia:
        mode: local
        gpuType: any
        runtime: nvidia
        containerRuntime: gvisor
        criuEnabled: true
        containerRuntimeConfig:
          gvisorPlatform: systrap
          gvisorRoot: /run/gvisor
          gvisorExtraArgs:
            - --overlay2=none
            - --file-access=exclusive
        poolSizing:
          minFreeCpu: "0"
          minFreeMemory: "0"
          minFreeGpu: 0
  imageService:
    runner:
      baseImageRegistry: public.ecr.aws/n4e0e1y0
  managedCompute:
    billableMarginPct: 0.10
    byoc:
      pricing:
        memoryHourlyMicrosPerGB: 4500
        cpuHourlyMicrosPerVCPU: 9500
      aws:
        templateUrl: ""
    billing:
      mode: noop
      endpoint: ""
      authToken: ""
      required: false
      timeout: 5s
      reconcileInterval: 1m
      minimumCreditCents: 2500

images:
  gateway:
    repository: public.ecr.aws/n4e0e1y0/beta9-gateway
    tag:        # Defaults to chart's app version
    pullPolicy: # Defaults to IfNotPresent
  worker:
    repository: public.ecr.aws/n4e0e1y0/beta9-worker
    tag:        # Defaults to chart's app version
    pullPolicy: # Defaults to IfNotPresent

# Worker pods already serve their own disk cache. This DaemonSet is a second
# cache process on every node.
cacheServer:
  enabled: false
  configSecretName: beta9-config-helm
  poolName: default
  locality: default
  serverPort: 2050
  hostPath: /var/lib/beta9/cache
  mountPath: /var/lib/beta9/cache
  # Must match the host path mounted at /images on workers in this locality.
  # Ignored when config.worker.imagePVCName is set.
  imagesHostPath: /images
  hostNetwork: true
  priorityClassName:
  image:
    repository: # Defaults to images.worker.repository
    tag:        # Defaults to images.worker.tag or chart app version
    pullPolicy: # Defaults to images.worker.pullPolicy or IfNotPresent
  nodeSelector: {}
  affinity: {}
  tolerations: []
  securityContext:
    privileged: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

controllers:
  gateway:
    annotations: {}
    labels: {}
    # The chart template also forces this off. Host networking would publish
    # the gateway ports on the node and skip the ingress.
    hostNetwork: false
    replicas: 1
    pod:
      # 180s gateway shutdownTimeout + 10s readiness propagation + 5s buffer.
      terminationGracePeriodSeconds: "195"
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: 1
      surge: "0"
    initContainers:
      wait-on-backends:
        image:
          repository: busybox
          tag: 1.37.0
        command:
        - sh
        - -c
        - |
          until nc -z postgresql 5432; do echo "Waiting on PostgreSQL..."; sleep 2; done;
          until nc -z redis-master 6379; do echo "Waiting on Redis..."; sleep 2; done;
          until nc -z beta9-minio 9000; do echo "Waiting on MinIO..."; sleep 2; done;
          echo "All systems ready!"

persistence:
  images:
    # A 50Gi local-path ReadWriteOnce claim can attach to one node only.
    # config.worker.imagePVCName is empty, so workers use the /images host path.
    enabled: false
    # enabled: true
    # type: persistentVolumeClaim
    # size: 50Gi
    # storageClass: local-path
    # accessMode: ReadWriteOnce

service:
  gateway:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9090"
    labels: {}
    ports:
      grpc:
        port: 1993
        targetPort: 1993
        protocol: TCP
      http:
        primary: true
        port: 1994
        targetPort: 1994
        protocol: TCP
      metrics:
        port: 9090
        targetPort: 9090
        protocol: TCP
    type: ClusterIP
    # type: LoadBalancer

ingress:
  # k3s includes this CRD. Set false on a cluster that has no Traefik and uses
  # the nginx basic-auth annotations below instead.
  traefik:
    enabled: true
  gateway:
    enabled: true
    # Install into the beta9 namespace. The Traefik middleware reference below
    # is <namespace>-<middleware name>@kubernetescrd.
    className:
    annotations:
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: beta9-ingress-auth
      nginx.ingress.kubernetes.io/auth-realm: SynapsAI Beta9
      traefik.ingress.kubernetes.io/router.middlewares: beta9-beta9-auth@kubernetescrd
    labels: {}
    hosts:
      - host: gateway.beta9.local
        paths:
          - path: /
            pathType: Prefix
            service:
              name: gateway
              port: http

serviceAccount:
  name: beta9
  annotations: {}
  labels: {}

# -- In-memory cache for container images.
# Checkpoints use the worker disk cache and the workspace bucket.
# https://github.com/beam-cloud/blobcache/deploy/charts/blobcache/values.yaml
blobcache:
  enabled: false

# -- Needed by Gateway
redis:
  enabled: true
  nameOverride: redis
  fullnameOverride: redis
  architecture: standalone
  auth:
    enabled: true
    existingSecret: beta9-credentials
    existingSecretPasswordKey: redis-password
    sentinel: false
  master:
    configuration: |
      activedefrag yes
      notify-keyspace-events AKE
    persistence:
      size: 1Gi

# -- Needed by Gateway
postgresql:
  enabled: true
  nameOverride: postgresql
  fullnameOverride: postgresql
  global:
    postgresql:
      auth:
        username: beta9
        database: main
        existingSecret: beta9-credentials
        secretKeys:
          adminPasswordKey: postgres-admin-password
          userPasswordKey: postgres-password
          replicationPasswordKey: replication-password
  primary:
    extendedConfiguration: |
      max_connections=400
      shared_buffers='400MB'
  volumePermissions:
    enabled: true
  persistence:
    enabled: true
    size: 1Gi

# -- Enables deployment of victoria-metrics and grafana
metrics:
  enabled: false

